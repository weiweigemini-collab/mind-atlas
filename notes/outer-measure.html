<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外測度｜線上腦海</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">線上腦海 · 筆記索引</a></nav><h1>外測度</h1><p>如果還不知道集合是否可測，能先估計它有多大嗎？</p><h2>概念</h2><p>外測度 μ* 定義在 X 的所有子集上，取值介於 0 與正無窮之間（含兩端）。它滿足空集取零、單調性與可數次可加性。在實線上，Lebesgue 外測度取所有可數開區間覆蓋的總長度下確界。</p><h2>例題</h2><p>單點 {0} 可用長度為 ε 的開區間覆蓋，對每個 ε &gt; 0 都成立。因此它的 Lebesgue 外測度介於 0 與每個 ε 之間，只能等於 0。</p><h2>下一步</h2><p>知道每個集合的外測度後，還需要一個條件判定哪些集合能把測量值精確地分成兩部分。接著看 <a href="caratheodory.html">Carathéodory 可測性</a>。</p></main></html>
